<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel FIIs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --fundo:#16202E; --placa:#1E2B3D; --placa-alta:#243247;
  --tinta:#EFE9DD; --tinta-fraca:#8DA0B8;
  --alta:#46A07A; --baixa:#D2604E; --latao:#C8A44D; --linha:#2C3A4F;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--fundo); color:var(--tinta);
  font-family:'Barlow',-apple-system,'Segoe UI',Roboto,sans-serif;
  font-variant-numeric:tabular-nums lining-nums;
  overflow:hidden; display:flex; flex-direction:column;
}
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:1.6vh 2vw 1.2vh; border-bottom:1px solid var(--linha); flex:0 0 auto;
}
.logo{height:6vh;width:auto;display:block}
.relogio{display:flex;align-items:baseline;gap:1.6vw;font-size:2.6vh;color:var(--tinta-fraca);font-weight:500}
.relogio strong{font-family:'Barlow Condensed',sans-serif;font-size:4vh;color:var(--tinta);font-weight:600}
.selo{color:var(--latao)}
.fechado{color:var(--latao);font-weight:600;display:none}

main{
  flex:1 1 auto; display:grid;
  grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr;
  gap:1.1vh 1.1vw; padding:1.3vh 2vw; min-height:0;
}
.card{
  background:var(--placa); border:1px solid var(--linha); border-left:4px solid var(--latao);
  padding:1.9vh 1.6vw; display:flex; flex-direction:column; justify-content:space-between;
  min-height:0; opacity:1; transition:opacity .45s ease;
}
.card.trocando{opacity:0}
.card.vazio{background:transparent;border-color:transparent}
.card.vazio *{display:none}

.linha-topo{display:flex;align-items:flex-start;justify-content:space-between;gap:1vw}
.ticker{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:8.2vh;line-height:.9;letter-spacing:.01em}
.nome{color:var(--tinta-fraca);font-size:2.4vh;font-weight:500;margin-top:.5vh}
.grupo{color:var(--latao);font-size:2.6vh;font-weight:600;white-space:nowrap;padding-top:1.4vh}
.preco-bloco{display:flex;align-items:center;gap:1.4vw;margin:.6vh 0}
.preco{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:9vh;line-height:1}
.var{display:flex;align-items:baseline;gap:.8vw;white-space:nowrap}
.var-pct{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:3.8vh;padding:.3vh .7vw;border-radius:.7vh;line-height:1.1}
.var-pct.sobe{color:var(--alta);background:rgba(70,160,122,.16)}
.var-pct.desce{color:var(--baixa);background:rgba(210,96,78,.16)}
.var-pct.estavel{color:var(--tinta-fraca)}
.var-rs{font-family:'Barlow Condensed',sans-serif;font-weight:500;font-size:2.9vh}
.sobe{color:var(--alta)} .desce{color:var(--baixa)} .estavel{color:var(--tinta-fraca)}

.indicadores{display:grid;grid-template-columns:1fr 1fr;gap:1.1vh 1.2vw;border-top:1px solid var(--linha);padding-top:1.2vh}
.ind span{display:block;color:var(--tinta-fraca);font-size:2vh;font-weight:500;margin-bottom:.3vh;white-space:nowrap}
.ind strong{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:4.4vh;line-height:1;white-space:nowrap}
.pvp-baixo strong{color:var(--alta)}
.pvp-alto strong{color:var(--baixa)}
.dy strong{color:var(--latao)}

footer{
  flex:0 0 auto; border-top:1px solid var(--linha); background:var(--placa-alta);
  overflow:hidden; white-space:nowrap; padding:1.5vh 0;
}
.trilho{display:inline-block;will-change:transform;animation:correr 150s linear infinite}
@keyframes correr{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.item{display:inline-flex;align-items:baseline;gap:.6vw;padding:0 1.8vw;
      font-family:'Barlow Condensed',sans-serif;font-size:4.2vh;font-weight:600}
.item .val{font-weight:500;color:var(--tinta)}

.aviso{position:fixed;left:2vw;bottom:11vh;background:var(--baixa);color:#fff;
       padding:1vh 1.3vw;font-size:2.4vh;font-weight:600;display:none}
.aviso.visivel{display:block}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>

// Feriados da B3, formato "AAAA-MM-DD". Vazio = feriado conta como pregão.
const FERIADOS = ["2026-11-02", "2026-11-20", "2026-12-25"];

const ROSTER = [{"t": "HGLG11", "n": "FII HGLG PAX", "g": "Logística"}, {"t": "BTLG11", "n": "FII BTLG", "g": "Logística"}, {"t": "XPLG11", "n": "FII XP LOG", "g": "Logística"}, {"t": "BRCO11", "n": "FII BRESCO", "g": "Logística"}, {"t": "VILG11", "n": "FII VINCI LG", "g": "Logística"}, {"t": "LVBI11", "n": "FII LVBI VBI", "g": "Logística"}, {"t": "GGRC11", "n": "FII GGR ZAG", "g": "Logística"}, {"t": "HSLG11", "n": "FII HSI LOG", "g": "Logística"}, {"t": "RBRL11", "n": "FII RBRL PAX", "g": "Logística"}, {"t": "CPLG11", "n": "FII CPLG", "g": "Logística"}, {"t": "PVBI11", "n": "FII PVBI VBI", "g": "Escritórios"}, {"t": "HGRE11", "n": "FII HGRE PAX", "g": "Escritórios"}, {"t": "JSRE11", "n": "FII JS REAL", "g": "Escritórios"}, {"t": "RCRB11", "n": "FII RIOB RC", "g": "Escritórios"}, {"t": "BRCR11", "n": "FII BC FUND", "g": "Escritórios"}, {"t": "AIEC11", "n": "FII AUTONOMY", "g": "Escritórios"}, {"t": "RBRP11", "n": "FII RBRP PAX", "g": "Escritórios"}, {"t": "CPOF11", "n": "FII CPOF", "g": "Escritórios"}, {"t": "TVRI11", "n": "FII TIVIO RI", "g": "Escritórios"}, {"t": "BROF11", "n": "FII BROF", "g": "Escritórios"}, {"t": "GTWR11", "n": "FII G TOWERS", "g": "Escritórios"}, {"t": "HGRU11", "n": "FII HGRU PAX", "g": "Renda urbana"}, {"t": "TRXF11", "n": "FII TRX REAL", "g": "Renda urbana"}, {"t": "RBVA11", "n": "FII RIOB VA", "g": "Renda urbana"}, {"t": "CPUR11", "n": "FII CPHBC UR", "g": "Renda urbana"}, {"t": "GARE11", "n": "FII GUARDIAN", "g": "Renda urbana"}, {"t": "TRXB11", "n": "FII TRX R II", "g": "Renda urbana"}, {"t": "XPML11", "n": "FII XP MALLS", "g": "Shoppings"}, {"t": "VISC11", "n": "FII VINCI SC", "g": "Shoppings"}, {"t": "HSML11", "n": "FII HSI MALL", "g": "Shoppings"}, {"t": "HGBS11", "n": "FII HEDGEBS", "g": "Shoppings"}, {"t": "PMLL11", "n": "FII PMLL PAX", "g": "Shoppings"}, {"t": "CPSH11", "n": "FII CPSH", "g": "Shoppings"}, {"t": "KNRI11", "n": "FII KINEA", "g": "Híbrido"}, {"t": "ALZR11", "n": "FII ALIANZA", "g": "Híbrido"}, {"t": "RZAT11", "n": "FII ARCTIUM", "g": "Híbrido"}];

const $ = id => document.getElementById(id);

/* Pregão da B3: dias úteis, 10h às 17h05, horário de Brasília. */
function mercadoAberto(){
  const f = new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',
    weekday:'short',year:'numeric',month:'2-digit',day:'2-digit',
    hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
  const g = t => f.find(x => x.type === t).value;
  const dia = g('weekday').slice(0,3).toLowerCase();
  if (dia.startsWith('s\u00e1') || dia.startsWith('dom')) return false;
  if (FERIADOS.includes(g('year')+'-'+g('month')+'-'+g('day'))) return false;
  const min = parseInt(g('hour'),10)*60 + parseInt(g('minute'),10);
  return min >= 600 && min <= 1025;
}

/* Variação do dia: só em dia de pregão a partir das 10h (antes disso o preço
   ainda é o fechamento anterior) e só se for plausível para um FII. */
function pregaoDeHojeIniciado(){
  const f = new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',
    weekday:'short',year:'numeric',month:'2-digit',day:'2-digit',
    hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
  const g = t => f.find(x => x.type === t).value;
  const dia = g('weekday').slice(0,3).toLowerCase();
  if (dia.startsWith('s\u00e1') || dia.startsWith('dom')) return false;
  if (FERIADOS.includes(g('year')+'-'+g('month')+'-'+g('day'))) return false;
  return parseInt(g('hour'),10)*60 + parseInt(g('minute'),10) >= 600;
}
function hojeISO(){
  const f = new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',
    year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
  const g = t => f.find(x => x.type === t).value;
  return g('year')+'-'+g('month')+'-'+g('day');
}
function variacao(f){
  if (!pregaoDeHojeIniciado() || isNaN(f.preco) || isNaN(f.ant) || f.ant <= 0) return null;
  const rs = f.preco - f.ant, pct = rs / f.ant * 100;
  if (Math.abs(pct) > 30) return null;
  return { rs, pct };
}

let dados = [], pagina = 0, aberto = true;

const brl = v => v == null || isNaN(v) ? "—"
  : v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const compacto = v => {
  if (v == null || isNaN(v)) return "—";
  if (v >= 1e6) return (v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1})+" mi";
  if (v >= 1e3) return (v/1e3).toLocaleString('pt-BR',{maximumFractionDigits:0})+" mil";
  return brl(v);
};

function exemplo(){
  let s = 7; const r = () => (s = (s*9301+49297)%233280)/233280;
  return ROSTER.map(f => ({
    ticker:f.t, nome:f.n, segmento:f.g,
    preco: 10 + r()*180,
    liq7: 7e5 + r()*3.5e7,
    liq30: 7e5 + r()*3.5e7,
    pvp: 0.5 + r()*0.6,
    dy12: 7 + r()*7
  })).map(d => (d.ant = d.preco / (1 + (r()-0.48)*0.025), d));
}

function parseCSV(txt){
  return txt.trim().split(/\r?\n/).slice(1).map(l => {
    const c = []; let atual = "", aspas = false;
    for (const ch of l){
      if (ch === '"') aspas = !aspas;
      else if (ch === ',' && !aspas){ c.push(atual); atual = ""; }
      else atual += ch;
    }
    c.push(atual);
    const num = s => {
      const v = parseFloat(String(s||"").replace(/[R$\s]/g,'')
                 .replace(/\.(?=\d{3}\b)/g,'').replace(',','.'));
      return isNaN(v) ? NaN : v;
    };
    return { ticker:(c[0]||"").trim(), nome:(c[1]||"").trim(), segmento:(c[2]||"").trim(),
             preco:num(c[4]), liq7:num(c[10]), liq30:num(c[11]),
             pvp:num(c[8]), dy12:num(c[9]),
             ant: (String(c[16]||'').trim() === hojeISO()) ? num(c[14]) : num(c[15]) };
  }).filter(d => d.ticker);
}

async function carregar(){
  if (!CSV_URL){
    dados = exemplo();
    $('origem').textContent = "dados de exemplo";
    $('origem').style.color = "var(--latao)";
    marcarHora(); desenharEsteira(); return;
  }
  try{
    const resp = await fetch(CSV_URL + (CSV_URL.includes('?')?'&':'?') + 'cb=' + Date.now());
    if (!resp.ok) throw new Error(resp.status);
    const novos = parseCSV(await resp.text());
    if (!novos.length) throw new Error("planilha sem linhas");
    dados = novos;
    $('origem').textContent = "dados da planilha";
    $('origem').style.color = "var(--alta)";
    $('aviso').classList.remove('visivel');
  }catch(e){
    $('aviso').textContent = "Planilha fora do ar — última leitura. (" + e.message + ")";
    $('aviso').classList.add('visivel');
    if (!dados.length) dados = exemplo();
  }
  marcarHora(); desenharEsteira();
}

function marcarHora(){
  aberto = mercadoAberto();
  if (aberto){
    $('atualizado').textContent = new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    $('rotulo').textContent = "atualizado";
    $('fechado').style.display = "none";
  } else {
    $('atualizado').textContent = "";
    $('rotulo').textContent = "";
    $('fechado').style.display = "inline";
  }
}

function montarGrade(){
  $('grade').innerHTML = "";
  for (let i = 0; i < 4; i++){
    const d = document.createElement('div');
    d.className = 'card'; d.id = 'card' + i;
    d.innerHTML = `
      <div>
        <div class="linha-topo">
          <div><div class="ticker"></div><div class="nome"></div></div>
          <div class="grupo"></div>
        </div>
        <div class="preco-bloco">
          <div class="preco"></div>
          <div class="var"><span class="var-pct"></span><span class="var-rs"></span></div>
        </div>
      </div>
      <div class="indicadores">
        <div class="ind pvp"><span>P/VP</span><strong class="pvpv"></strong></div>
        <div class="ind dy"><span>DY 12 meses</span><strong class="dy12"></strong></div>
        <div class="ind"><span>Liq. méd. diária 7d</span><strong class="l7"></strong></div>
        <div class="ind"><span>Liq. méd. diária 30d</span><strong class="l30"></strong></div>
      </div>`;
    $('grade').appendChild(d);
  }
}

function pintar(){
  if (!dados.length) return;
  const total = Math.ceil(dados.length/4);
  pagina = pagina % total;
  const lote = dados.slice(pagina*4, pagina*4+4);
  $('passo').textContent = (pagina+1) + "/" + total;
  for (let i = 0; i < 4; i++){
    const c = $('card'+i), f = lote[i];
    if (!f){ c.classList.add('vazio'); continue; }
    c.classList.remove('vazio');
    c.querySelector('.ticker').textContent = f.ticker;
    c.querySelector('.nome').textContent   = f.nome || "";
    c.querySelector('.grupo').textContent  = f.segmento || "";
    c.querySelector('.preco').textContent  = "R$ " + brl(f.preco);
    const v = variacao(f), vp = c.querySelector('.var-pct'), vr = c.querySelector('.var-rs');
    if (!v){ vp.textContent = "—"; vp.className = 'var-pct estavel'; vr.textContent = ""; }
    else {
      const cls = v.pct > 0.004 ? 'sobe' : v.pct < -0.004 ? 'desce' : 'estavel';
      const seta = cls === 'sobe' ? '↑ ' : cls === 'desce' ? '↓ ' : '';
      vp.textContent = seta + brl(Math.abs(v.pct)) + "%";
      vp.className = 'var-pct ' + cls;
      vr.textContent = (v.rs > 0 ? "+" : v.rs < 0 ? "−" : "") + brl(Math.abs(v.rs)) + " hoje";
      vr.className = 'var-rs ' + cls;
    }
    c.querySelector('.l7').textContent     = compacto(f.liq7);
    c.querySelector('.l30').textContent    = compacto(f.liq30);
    c.querySelector('.pvpv').textContent   = isNaN(f.pvp) ? "—"
      : f.pvp.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
    c.querySelector('.pvp').className = 'ind pvp' + (isNaN(f.pvp) ? '' : f.pvp < 1 ? ' pvp-baixo' : ' pvp-alto');
    c.querySelector('.dy12').textContent   = isNaN(f.dy12) ? "—" : brl(f.dy12) + "%";
  }
}

function girar(){
  const cards = [...document.querySelectorAll('.card')];
  cards.forEach(c => c.classList.add('trocando'));
  setTimeout(() => { pagina++; pintar(); cards.forEach(c => c.classList.remove('trocando')); }, 450);
}

function desenharEsteira(){
  const bloco = dados.map(f =>
    `<span class="item"><b>${f.ticker}</b> <span class="val">R$ ${brl(f.preco)}</span> ${(() => {
       const v = variacao(f);
       if (!v) return '<span class="estavel">—</span>';
       const cls = v.pct > 0.004 ? 'sobe' : v.pct < -0.004 ? 'desce' : 'estavel';
       return `<span class="${cls}">${cls==='sobe'?'↑ ':cls==='desce'?'↓ ':''}${brl(Math.abs(v.pct))}%</span>`;
     })()}</span>`
  ).join("");
  $('trilho').innerHTML = bloco + bloco;
}

setInterval(() => {
  $('hora').textContent = new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}, 1000);
setInterval(() => { const a = aberto; marcarHora(); if (a !== aberto) pintar(); }, 60000);

(async function(){
  montarGrade();
  await carregar();
  pintar();
  setInterval(girar, SEGUNDOS*1000);
  setInterval(async () => { await carregar(); pintar(); }, MINUTOS_REFRESH*60*1000);
})();
</script>
